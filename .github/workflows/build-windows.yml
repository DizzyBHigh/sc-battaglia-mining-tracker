name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Electron Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build (electron-builder) with retries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "Build attempt $i of $max..."
            npm run dist
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Build succeeded"
              exit 0
            }
            Write-Host "Build failed with exit $LASTEXITCODE"
            if ($i -lt $max) {
              Write-Host "Waiting 30s before retry..."
              Start-Sleep -Seconds 30
            }
          }
          exit 1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sc-battaglia-mining-tracker-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/latest*.yml
          if-no-files-found: warn

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
