name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "main.js"
      - "preload.js"
      - "server/**"
      - "renderer/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    name: Build, tag & release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Read version from package.json
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version  Tag: $tag"

      - name: Check if tag already exists
        id: tagcheck
        shell: bash
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} is new — will build and release"
          fi

      - name: Install dependencies
        if: steps.tagcheck.outputs.exists == 'false'
        run: npm install

      - name: Build (electron-builder) with retries
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "Build attempt $i of $max..."
            npm run dist
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Build succeeded"
              exit 0
            }
            Write-Host "Build failed with exit $LASTEXITCODE"
            if ($i -lt $max) {
              Start-Sleep -Seconds 30
            }
          }
          exit 1

      - name: List dist outputs
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # Portable folder zip (extract & run) — dist itself stays gitignored / never committed
      - name: Create portable folder zip
        if: steps.tagcheck.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $name = "sc-battaglia-mining-tracker-$ver-portable-folder"
          $src = "dist\\win-unpacked"
          if (-not (Test-Path $src)) {
            Write-Error "Expected $src from electron-builder — not found"
            exit 1
          }
          $zip = "dist\\$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Upload build artifact
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: sc-battaglia-mining-tracker-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/latest*.yml
          if-no-files-found: error

      - name: Create tag and GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SC Battaglia Mining Tracker ${{ steps.ver.outputs.tag }}
          body: |
            ## SC Battaglia Mining Tracker ${{ steps.ver.outputs.tag }}

            ### Downloads
            - **Setup (NSIS installer):** `sc-battaglia-mining-tracker-${{ steps.ver.outputs.version }}-setup.exe`
            - **Portable single file:** `sc-battaglia-mining-tracker-${{ steps.ver.outputs.version }}-portable.exe`
            - **Portable folder (zip):** `sc-battaglia-mining-tracker-${{ steps.ver.outputs.version }}-portable-folder.zip` — extract and run the `.exe` inside

            GitHub also attaches automatic **Source code** zip/tar.gz for this tag (source only — no `dist/` or `node_modules/`).

            Built automatically from `main` when `package.json` version is new.
          files: |
            dist/*.exe
            dist/*-portable-folder.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
