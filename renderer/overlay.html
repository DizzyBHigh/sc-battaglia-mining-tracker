<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      height: 100%;
    }
    #bar {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      height: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.75rem;
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid rgba(88, 166, 255, 0.45);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      -webkit-app-region: drag;
      cursor: move;
    }
    #top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.15rem;
      -webkit-app-region: drag;
    }
    #status {
      font-size: clamp(0.65rem, 1.5vw, 0.8rem);
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
      transition: opacity 0.25s ease;
    }
    #status.ocr { color: #d29922; }
    #status.ocr_done { color: #3fb950; }
    #status.error { color: #f85149; }
    #status.scan_ready { color: #d29922; }
    #timer {
      display: none;
      font-family: ui-monospace, Consolas, monospace;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      letter-spacing: 0.03em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #timer.on { display: inline-block; }
    #timer.running { color: #3fb950; }
    #timer.paused { color: #d29922; }
    #list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      align-items: center;
      -webkit-app-region: drag;
    }
    .chip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.4rem;
      padding: 0.2rem 0.55rem 0.2rem 0.35rem;
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: #e6edf3;
      max-width: 100%;
      font-weight: 600;
      -webkit-app-region: drag;
    }
    .chip.done { opacity: 0.55; border-color: #238636; }
    .chip .count {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #d29922;
    }
    .chip .count.zero { color: #3fb950; }
    .chip .sum {
      font-weight: 500;
      font-size: 0.85em;
      color: #8b949e;
    }
    .chip .missions {
      font-weight: 600;
      font-size: 0.85em;
      color: #a371f7;
      white-space: nowrap;
    }
    .chip .sig {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      white-space: nowrap;
      font-size: clamp(0.65rem, 1.6vw, 0.85rem);
    }
    .scan-hit {
      display: none;
      width: 1.05rem;
      height: 1.05rem;
      min-width: 1.05rem;
      min-height: 1.05rem;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      border: 2px solid #58a6ff;
      background: rgba(88, 166, 255, 0.25);
      box-shadow: inset 0 0 0 2px rgba(13, 17, 23, 0.85);
      cursor: pointer;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      position: relative;
    }
    body.scan-click .scan-hit {
      display: inline-block;
    }
    .scan-hit:hover {
      background: rgba(88, 166, 255, 0.55);
      border-color: #79b8ff;
    }
    .scan-hit:active {
      background: #3fb950;
      border-color: #3fb950;
      transform: scale(0.92);
    }
    .scan-hit.busy {
      opacity: 0.5;
      pointer-events: none;
    }
    .scan-hit:disabled {
      opacity: 0.35;
      cursor: default;
      border-color: #30363d;
      background: rgba(48, 54, 61, 0.4);
    }
    .empty { color: #8b949e; font-size: 0.8rem; }
    .meta {
      font-size: clamp(0.6rem, 1.3vw, 0.75rem);
      color: #8b949e;
      margin-bottom: 0.15rem;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="top-row">
      <div id="status">Ready</div>
      <div id="timer" title="Session timer">00:00</div>
    </div>
    <div class="meta" id="meta"></div>
    <div id="list" class="empty">No active requirements</div>
  </div>
  <script>
    var STATUS_TTL_MS = 5000;
    var lastStatusKey = "";
    var clearTimer = null;
    var scanClickEnabled = false;
    var scanBusy = {};

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    function formatMs(ms) {
      if (ms < 0) ms = 0;
      var totalSec = Math.floor(ms / 1000);
      var h = Math.floor(totalSec / 3600);
      var m = Math.floor((totalSec % 3600) / 60);
      var s = totalSec % 60;
      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }
      if (h > 0) return pad(h) + ":" + pad(m) + ":" + pad(s);
      return pad(m) + ":" + pad(s);
    }

    function readScanClickPref() {
      try {
        return localStorage.getItem("sc_overlay_scan_click") === "1";
      } catch (_) {
        return false;
      }
    }

    function applyScanClickMode() {
      scanClickEnabled = readScanClickPref();
      document.body.classList.toggle("scan-click", scanClickEnabled);
    }

    function showReady() {
      var st = document.getElementById("status");
      if (!st) return;
      st.textContent = "Ready";
      st.className = "";
      lastStatusKey = "Ready|idle";
    }

    function applyStatus(message, phase, updatedAt) {
      var st = document.getElementById("status");
      if (!st) return;
      var msg = message || "Ready";
      var ph = phase || "";
      var key = msg + "|" + ph + "|" + (updatedAt || "");

      if (!msg || msg === "Ready" || ph === "idle") {
        if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
        st.textContent = msg || "Ready";
        st.className = "";
        lastStatusKey = key;
        return;
      }

      if (key !== lastStatusKey) {
        lastStatusKey = key;
        st.textContent = msg;
        st.className = ph;
        if (clearTimer) clearTimeout(clearTimer);
        clearTimer = setTimeout(function () {
          clearTimer = null;
          showReady();
        }, STATUS_TTL_MS);
      }
    }

    function flashStatus(msg, phase) {
      applyStatus(msg, phase || "ocr_done", String(Date.now()));
    }

    function refreshTimer() {
      var el = document.getElementById("timer");
      if (!el) return;
      try {
        var raw = localStorage.getItem("sc_timer_state");
        if (!raw) {
          el.className = "";
          return;
        }
        var st = JSON.parse(raw);
        if (!st || !st.showOnOverlay) {
          el.className = "";
          return;
        }
        var ms = st.accumulated || 0;
        if (st.running && st.startedAt) {
          ms += Date.now() - st.startedAt;
        }
        el.textContent = formatMs(ms);
        el.className = "on" + (st.running ? " running" : ms > 0 ? " paused" : "");
      } catch (_) {
        el.className = "";
      }
    }

    async function recordOverlayScan(resource) {
      if (!resource || scanBusy[resource]) return;
      scanBusy[resource] = true;
      var safeRes = String(resource).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      var btn = document.querySelector('.scan-hit[data-resource="' + safeRes + '"]');
      if (btn) btn.classList.add("busy");
      try {
        var r = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            resource: resource,
            count: 1,
            note: "overlay-click shared",
          }),
        });
        var data = await r.json();
        if (data.error) {
          flashStatus("Scan failed: " + data.error, "error");
        } else {
          var applied = data.applied || {};
          var n = Object.keys(applied).length;
          var completed = (data.newly_completed || []).length;
          var msg =
            "Shared 1× " +
            resource +
            (n
              ? " across " + n + " mission" + (n === 1 ? "" : "s")
              : " (no active mission needed it)");
          if (completed) msg += " · " + completed + " completed";
          flashStatus(msg, n ? "ocr_done" : "scan_ready");
        }
        await refresh();
      } catch (e) {
        flashStatus("Scan error", "error");
      } finally {
        scanBusy[resource] = false;
        if (btn) btn.classList.remove("busy");
      }
    }

    document.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains("scan-hit")) return;
      ev.preventDefault();
      ev.stopPropagation();
      if (t.disabled) return;
      var res = t.getAttribute("data-resource");
      if (res) recordOverlayScan(res);
    });

    async function refresh() {
      applyScanClickMode();
      try {
        const r = await fetch("/api/stats");
        const s = await r.json();
        if (s.status) {
          applyStatus(s.status.message, s.status.phase, s.status.updatedAt);
        }
        const missionN = s.remaining_mission_count != null
          ? s.remaining_mission_count
          : (s.active_count || 0);
        const meta = document.getElementById("meta");
        if (meta) {
          meta.textContent = missionN
            ? ("Across " + missionN + " mission" + (missionN === 1 ? "" : "s") + " · shared scans")
            : "";
        }
        const list = document.getElementById("list");
        const rem = s.remaining_shared || s.remaining_totals || {};
        const sumMap = s.remaining_sum || {};
        const byResMissions = s.remaining_mission_by_resource || {};
        const keys = Object.keys(rem).sort();
        if (!keys.length) {
          list.className = "empty";
          list.innerHTML = "No active requirements";
          return;
        }
        list.className = "";
        const detailed = s.remaining_detailed || {};
        const sigMap = s.signatures || {};
        list.innerHTML = keys.map((k) => {
          const d = detailed[k] || {};
          const n = d.shared != null ? d.shared : rem[k];
          const total = d.sum != null ? d.sum : (sumMap[k] != null ? sumMap[k] : n);
          const missionCover =
            d.missions != null
              ? d.missions
              : byResMissions[k] != null
                ? byResMissions[k]
                : 0;
          const base = d.signature != null ? d.signature : sigMap[k];
          let clusterList = Array.isArray(d.signatures) && d.signatures.length
            ? d.signatures
            : (base != null ? [base, base * 2, base * 3, base * 4, base * 5] : []);
          const sigNums = clusterList.join(" · ");
          const sumBit = total !== n
            ? ` <span class="sum">(${total} total)</span>`
            : "";
          const missionBit = missionCover
            ? ` <span class="missions" title="Active missions that still need ${escapeHtml(k)}">· ${missionCover} mission${missionCover === 1 ? "" : "s"}</span>`
            : "";
          const done = n === 0;
          const hit =
            `<button type="button" class="scan-hit" data-resource="${escapeHtml(k)}" ` +
            `title="Record 1 shared ${escapeHtml(k)} scan across ${missionCover || "all"} mission(s)"` +
            (done ? " disabled" : "") +
            ` aria-label="Record one shared ${escapeHtml(k)} scan"></button>`;
          const label = sigNums
            ? `${escapeHtml(k)} <span class="count ${done ? "zero" : ""}">${n}</span>${missionBit}${sumBit} <span class="sig">(${sigNums})</span>`
            : `${escapeHtml(k)} <span class="count ${done ? "zero" : ""}">${n}</span>${missionBit}${sumBit}`;
          const tip = `Scans needed (shared max): ${n}` +
            (missionCover ? ` · Covers ${missionCover} mission${missionCover === 1 ? "" : "s"}` : "") +
            (total !== n ? ` · Sum across missions: ${total}` : "") +
            (clusterList.length ? " · " + clusterList.map((v, i) => "x" + (i + 1) + "=" + v).join("  ") : "") +
            (scanClickEnabled ? " · Click circle = 1 shared scan on every active mission that still needs this" : "");
          return `<div class="chip ${done ? "done" : ""}" title="${escapeHtml(tip)}">${hit}${label}</div>`;
        }).join("");
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="empty">API offline</div>';
      }
    }

    applyScanClickMode();
    refresh();
    refreshTimer();
    setInterval(refresh, 1000);
    setInterval(refreshTimer, 200);
    setInterval(applyScanClickMode, 500);
    window.addEventListener("storage", function (ev) {
      if (ev.key === "sc_overlay_scan_click") applyScanClickMode();
    });
  </script>
</body>
</html>
