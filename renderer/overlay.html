<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SC Scan Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #bar {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 6px 10px 8px;
      border-radius: 12px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(88, 166, 255, 0.4);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      color: #e6edf3;
      backdrop-filter: blur(10px);
      -webkit-app-region: drag;
      cursor: move;
      overflow: hidden;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 0;
      margin-bottom: 4px;
    }

    .brand {
      font-size: clamp(10px, 1.6vh, 12px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #58a6ff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .meta {
      font-size: clamp(10px, 1.5vh, 12px);
      color: #8b949e;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #status {
      display: none;
      flex: 1 1 auto;
      min-width: 0;
      font-size: clamp(11px, 1.7vh, 13px);
      line-height: 1.3;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status.visible { display: block; }
    #status.phase-ocr {
      background: rgba(210, 153, 34, 0.22);
      border: 1px solid rgba(210, 153, 34, 0.55);
      color: #e3b341;
    }
    #status.phase-ocr_done {
      background: rgba(63, 185, 80, 0.18);
      border: 1px solid rgba(63, 185, 80, 0.5);
      color: #3fb950;
    }
    #status.phase-error {
      background: rgba(248, 81, 73, 0.18);
      border: 1px solid rgba(248, 81, 73, 0.45);
      color: #f85149;
    }
    #status.phase-idle {
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.3);
      color: #8b949e;
    }

    /* Fluid resource chips */
    #list {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: center;
      gap: 6px 8px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-app-region: no-drag;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid rgba(48, 54, 61, 0.95);
      font-size: clamp(11px, 1.8vh, 13px);
      line-height: 1.2;
      max-width: 100%;
    }
    .chip .name {
      font-weight: 600;
      color: #e6edf3;
      white-space: nowrap;
    }
    .chip .sig {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      white-space: nowrap;
      font-size: 0.92em;
    }
    .chip .count {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #3fb950;
      min-width: 1.1em;
      text-align: right;
    }
    .chip .count.zero { color: #8b949e; }
    .chip.done {
      opacity: 0.55;
      border-color: rgba(63, 185, 80, 0.35);
    }

    .empty {
      font-size: clamp(11px, 1.7vh, 13px);
      color: #8b949e;
      padding: 2px 4px;
    }

    /* Subtle resize hint corner (visual only; OS handles resize) */
    .resize-hint {
      position: absolute;
      right: 10px;
      bottom: 6px;
      width: 12px;
      height: 12px;
      opacity: 0.25;
      pointer-events: none;
      background:
        linear-gradient(135deg, transparent 50%, #8b949e 50%) no-repeat bottom right / 8px 8px;
    }
  </style>
</head>
<body>
  <div id="bar">
    <div class="top">
      <span class="brand">Scans</span>
      <span class="meta" id="meta">–</span>
      <div id="status" class="phase-idle"></div>
    </div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <div class="resize-hint"></div>
  <script>
    const API = "http://127.0.0.1:17845";

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function renderStatus(status) {
      const el = document.getElementById("status");
      if (!el) return;
      if (!status || !status.message) {
        el.classList.remove("visible");
        el.textContent = "";
        return;
      }
      const phase = status.phase || "idle";
      if (phase === "idle" && /^ready$/i.test(String(status.message).trim())) {
        el.classList.remove("visible");
        el.textContent = "";
        return;
      }
      el.className = "visible phase-" + phase;
      el.textContent = status.message;
      el.title = status.message;
    }

    async function refresh() {
      try {
        const r = await fetch(API + "/api/stats");
        const s = await r.json();
        const rem = s.remaining_totals || {};
        const keys = Object.keys(rem).sort((a, b) => rem[b] - rem[a] || a.localeCompare(b));
        document.getElementById("meta").textContent =
          (s.active_count || 0) + " mission" + (s.active_count === 1 ? "" : "s");

        renderStatus(s.status);

        const list = document.getElementById("list");
        if (!keys.length) {
          list.innerHTML = '<div class="empty">Nothing left to scan</div>';
          return;
        }
        const detailed = s.remaining_detailed || {};
        const sigMap = s.signatures || {};
        list.innerHTML = keys.map((k) => {
          const n = rem[k];
          const sig = (detailed[k] && detailed[k].signature != null)
            ? detailed[k].signature
            : sigMap[k];
          const sigHtml = sig != null
            ? `<span class="sig" title="Base RS (1 rock)">RS ${sig}</span>`
            : "";
          const done = n === 0;
          return `<div class="chip ${done ? "done" : ""}" title="${escapeHtml(k)}${sig != null ? " · RS " + sig : ""}">
            <span class="name">${escapeHtml(k)}</span>
            ${sigHtml}
            <span class="count ${done ? "zero" : ""}">${n}</span>
          </div>`;
        }).join("");
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="empty">API offline</div>';
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
