<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      height: 100%;
    }
    #bar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.75rem;
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid rgba(88, 166, 255, 0.45);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      -webkit-app-region: drag;
      cursor: move;
    }
    #status {
      font-size: clamp(0.65rem, 1.5vw, 0.8rem);
      color: #8b949e;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: drag;
      transition: opacity 0.25s ease;
    }
    #status.ocr { color: #d29922; }
    #status.ocr_done { color: #3fb950; }
    #status.error { color: #f85149; }
    #status.fading { opacity: 0.45; }
    #list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      align-items: center;
      -webkit-app-region: drag;
    }
    .chip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: #e6edf3;
      max-width: 100%;
      font-weight: 600;
      -webkit-app-region: drag;
    }
    .chip.done { opacity: 0.55; border-color: #238636; }
    .chip .count {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #d29922;
    }
    .chip .count.zero { color: #3fb950; }
    .chip .sum {
      font-weight: 500;
      font-size: 0.85em;
      color: #8b949e;
    }
    .chip .sig {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      white-space: nowrap;
      font-size: clamp(0.65rem, 1.6vw, 0.85rem);
    }
    .empty { color: #8b949e; font-size: 0.8rem; }
    .meta {
      font-size: clamp(0.6rem, 1.3vw, 0.75rem);
      color: #8b949e;
      margin-bottom: 0.15rem;
      -webkit-app-region: drag;
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="status">Ready</div>
    <div class="meta" id="meta"></div>
    <div id="list" class="empty">No active requirements</div>
  </div>
  <script>
    var STATUS_TTL_MS = 5000;
    var lastStatusKey = "";
    var clearTimer = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    function showReady() {
      var st = document.getElementById("status");
      if (!st) return;
      st.textContent = "Ready";
      st.className = "";
      lastStatusKey = "Ready|idle";
    }

    function applyStatus(message, phase, updatedAt) {
      var st = document.getElementById("status");
      if (!st) return;
      var msg = message || "Ready";
      var ph = phase || "";
      var key = msg + "|" + ph + "|" + (updatedAt || "");

      if (!msg || msg === "Ready" || ph === "idle") {
        if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
        st.textContent = msg || "Ready";
        st.className = "";
        lastStatusKey = key;
        return;
      }

      if (key !== lastStatusKey) {
        lastStatusKey = key;
        st.textContent = msg;
        st.className = ph;
        if (clearTimer) clearTimeout(clearTimer);
        clearTimer = setTimeout(function () {
          clearTimer = null;
          showReady();
        }, STATUS_TTL_MS);
      }
    }

    async function refresh() {
      try {
        const r = await fetch("/api/stats");
        const s = await r.json();
        if (s.status) {
          applyStatus(s.status.message, s.status.phase, s.status.updatedAt);
        }
        const missionN = s.remaining_mission_count != null
          ? s.remaining_mission_count
          : (s.active_count || 0);
        const meta = document.getElementById("meta");
        if (meta) {
          meta.textContent = missionN
            ? ("Across " + missionN + " mission" + (missionN === 1 ? "" : "s") + " · shared scans")
            : "";
        }
        const list = document.getElementById("list");
        // remaining_totals is now shared scans needed (max across missions)
        const rem = s.remaining_shared || s.remaining_totals || {};
        const sumMap = s.remaining_sum || {};
        const keys = Object.keys(rem).sort();
        if (!keys.length) {
          list.className = "empty";
          list.innerHTML = "No active requirements";
          return;
        }
        list.className = "";
        const detailed = s.remaining_detailed || {};
        const sigMap = s.signatures || {};
        list.innerHTML = keys.map((k) => {
          const d = detailed[k] || {};
          const n = d.shared != null ? d.shared : rem[k];
          const total = d.sum != null ? d.sum : (sumMap[k] != null ? sumMap[k] : n);
          const base = d.signature != null ? d.signature : sigMap[k];
          let clusterList = Array.isArray(d.signatures) && d.signatures.length
            ? d.signatures
            : (base != null ? [base, base * 2, base * 3, base * 4, base * 5] : []);
          const sigNums = clusterList.join(" · ");
          const sumBit = total !== n
            ? ` <span class="sum">(${total} total)</span>`
            : "";
          const label = sigNums
            ? `${escapeHtml(k)} <span class="count ${n === 0 ? "zero" : ""}">${n}</span>${sumBit} <span class="sig">(${sigNums})</span>`
            : `${escapeHtml(k)} <span class="count ${n === 0 ? "zero" : ""}">${n}</span>${sumBit}`;
          const tip = `Scans needed (shared): ${n}` +
            (total !== n ? ` · Sum across missions: ${total}` : "") +
            (clusterList.length ? " · " + clusterList.map((v, i) => "x" + (i + 1) + "=" + v).join("  ") : "");
          const done = n === 0;
          return `<div class="chip ${done ? "done" : ""}" title="${escapeHtml(tip)}">${label}</div>`;
        }).join("");
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="empty">API offline</div>';
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
