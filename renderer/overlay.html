<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SC Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      height: 100%;
    }
    #bar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.75rem;
      background: rgba(13, 17, 23, 0.82);
      border: 1px solid rgba(48, 54, 61, 0.9);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      -webkit-app-region: no-drag;
    }
    #status {
      font-size: clamp(0.65rem, 1.5vw, 0.8rem);
      color: #8b949e;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.ocr { color: #d29922; }
    #status.ocr_done { color: #3fb950; }
    #status.error { color: #f85149; }
    #list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.45rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: #e6edf3;
      max-width: 100%;
    }
    .chip.done { opacity: 0.55; border-color: #238636; }
    .chip .name { font-weight: 600; }
    .chip .sig {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #58a6ff;
      white-space: nowrap;
      font-size: clamp(0.65rem, 1.6vw, 0.85rem);
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15rem 0.2rem;
      max-width: min(70vw, 28rem);
    }
    .chip .sig-part {
      color: #58a6ff;
      font-weight: 700;
    }
    .chip .sig-sep {
      color: rgba(139, 148, 158, 0.7);
      margin: 0 0.1rem;
      font-weight: 400;
    }
    .chip .count {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #d29922;
    }
    .chip .count.zero { color: #3fb950; }
    .empty { color: #8b949e; font-size: 0.8rem; }
    .drag-handle {
      -webkit-app-region: drag;
      cursor: move;
      color: #8b949e;
      font-size: 0.7rem;
      padding: 0 0.3rem;
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="status">Ready</div>
    <div id="list" class="empty">No active requirements</div>
  </div>
  <script>
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    async function refresh() {
      try {
        const r = await fetch("/api/stats");
        const s = await r.json();
        const st = document.getElementById("status");
        if (s.status) {
          st.textContent = s.status.message || "Ready";
          st.className = s.status.phase || "";
        }
        const list = document.getElementById("list");
        const rem = s.remaining_totals || {};
        const keys = Object.keys(rem).sort();
        if (!keys.length) {
          list.className = "empty";
          list.innerHTML = "No active requirements";
          return;
        }
        list.className = "";
        const detailed = s.remaining_detailed || {};
        const sigMap = s.signatures || {};
        list.innerHTML = keys.map((k) => {
          const n = rem[k];
          const d = detailed[k] || {};
          const base = d.signature != null ? d.signature : sigMap[k];
          let clusterList = Array.isArray(d.signatures) && d.signatures.length
            ? d.signatures
            : (base != null ? [base, base * 2, base * 3, base * 4, base * 5] : []);
          const parts = clusterList.map((v, i) => {
            const rocks = i + 1;
            return `<span class="sig-part" title="${rocks} rock cluster">x${rocks} ${v}</span>`;
          });
          const sigHtml = parts.length
            ? `<span class="sig">${parts.join('<span class="sig-sep">·</span>')}</span>`
            : "";
          const tip = clusterList.length
            ? clusterList.map((v, i) => "x" + (i + 1) + "=" + v).join("  ")
            : "";
          const done = n === 0;
          return `<div class="chip ${done ? "done" : ""}" title="${escapeHtml(k)}${tip ? " · " + tip : ""}">
            <span class="name">${escapeHtml(k)}</span>
            ${sigHtml}
            <span class="count ${done ? "zero" : ""}">${n}</span>
          </div>`;
        }).join("");
      } catch (e) {
        document.getElementById("list").innerHTML =
          '<div class="empty">API offline</div>';
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
